<button #button type="button" class="bell" (click)="toggle()" [attr.aria-expanded]="open()" aria-haspopup="true"
  [attr.aria-label]="unread() ? unread() + ' unread notifications' : 'Notifications'">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
  </svg>
  @if (unread()) {
    <span class="badge">{{ unread() > 99 ? '99+' : unread() }}</span>
  }
</button>

@if (open()) {
  <div class="panel" role="dialog" aria-label="Notifications" [style.top.px]="position().top" [style.left.px]="position().left">
    <div class="panel-head">
      <strong>Notifications</strong>
      @if (unread()) {
        <button type="button" class="mark-all" (click)="markAll()">Mark all read</button>
      }
    </div>
    @if (loading()) {
      <p class="empty">Loading…</p>
    } @else {
      <ul>
        @for (item of items(); track item.id) {
          <li>
            <button type="button" class="item" [class.is-unread]="!item.isRead" (click)="select(item)">
              <span class="title">{{ item.title }}</span>
              @if (item.body) {
                <span class="body">{{ item.body }}</span>
              }
              <span class="when">{{ timeAgo(item.createdAt) }}</span>
            </button>
          </li>
        } @empty {
          <li class="empty">You're all caught up. Reminders for follow-ups, exams, visa appointments and payments appear here.</li>
        }
      </ul>
    }
  </div>
}
