<div class="auth-card">

  <div class="header">
    <h2>Sign in to your account</h2>
    <p>Manage your leads, quotations, and active follow-up queues.</p>
  </div>

  @if (errorMessage()) {
  <div class="alert-box error">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>{{ errorMessage() }}</span>
  </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
    <!-- Email Field -->
    <div class="field">
      <label for="email">Work Email</label>
      <div class="input-wrapper">
        <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <input id="email" type="email" formControlName="email" placeholder="name@company.com" autocomplete="email" />
      </div>
    </div>

    <!-- Password Field -->
    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
        <a routerLink="/auth/forgot-password" class="link-muted">Forgot password?</a>
      </div>

      <div class="input-wrapper">
        <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
          placeholder="••••••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-password" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          @if (showPassword()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          }
        </button>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-button" [disabled]="isLoading()">
      @if (isLoading()) {
      <span class="spinner"></span>
      <span>Signing in...</span>
      } @else {
      <span>Sign in to Dashboard</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
      }
    </button>
  </form>

  @if (googleEnabled) {
  <div class="divider">
    <span>or</span>
  </div>

  <!-- Sign in with Google (button rendered by Google Identity Services) -->
  <div class="social-login">
    <div #googleButton class="google-button"></div>
  </div>
  }

  <div class="bottom-link">
    <span>Don't have an account yet?</span>
    <a routerLink="/auth/register" class="highlight-link">Create business account</a>
  </div>
</div>
